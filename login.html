<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hillard Performance — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0a0a0b;color:#f0f0f4;font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;}
.logo-wrap{margin-bottom:40px;text-align:center;animation:fadeUp 0.5s ease both;}
.logo-wrap img{height:48px;width:auto;filter:invert(1);}
.card{background:#111114;border:1px solid #2a2a32;border-radius:20px;padding:32px 28px;width:100%;max-width:380px;animation:fadeUp 0.5s 0.1s ease both;}
.card h2{font-family:"Rajdhani",sans-serif;font-size:22px;font-weight:700;letter-spacing:0.06em;margin-bottom:6px;}
.card p{color:#6b6b7a;font-size:13px;line-height:1.6;margin-bottom:28px;}
label{display:block;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:#6b6b7a;margin-bottom:8px;}
input[type=email]{width:100%;background:#18181d;border:1px solid #2a2a32;border-radius:9px;padding:13px 15px;color:#f0f0f4;font-family:"DM Sans",sans-serif;font-size:15px;outline:none;transition:border-color 0.2s,box-shadow 0.2s;}
input[type=email]:focus{border-color:#e8291c;box-shadow:0 0 0 3px rgba(232,41,28,0.1);}
input[type=email]::placeholder{color:#3a3a45;}
.btn{width:100%;background:#e8291c;color:white;border:none;border-radius:9px;padding:14px;font-family:"Rajdhani",sans-serif;font-size:15px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;margin-top:16px;transition:opacity 0.2s;}
.btn:hover{opacity:0.88;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.err{color:#e8291c;font-size:12px;margin-top:10px;display:none;}
.success{display:none;text-align:center;padding:8px 0 0;}
.success .tick{font-size:48px;margin-bottom:16px;}
.success h3{font-family:"Rajdhani",sans-serif;font-size:20px;font-weight:700;margin-bottom:8px;}
.success p{color:#b0b0be;font-size:13px;line-height:1.6;}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>

<div class="card">
  <div id="form-view">
    <h2>Sign in to My Garage</h2>
    <p>Enter your email and we will send you a secure login link. No password needed.</p>
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <p class="err" id="err-msg"></p>
    <button class="btn" id="send-btn" onclick="sendLink()">Send Login Link</button>
  </div>
  <div class="success" id="success-view">
    <div class="tick">📬</div>
    <h3>Check your inbox</h3>
    <p>We sent a login link to<br><strong id="sent-to" style="color:#f0f0f4;"></strong><br><br>Click the link in the email to open your garage.</p>

  </div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
const supabase = createClient('https://jkruphtrqlcrwfuoemzt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImprcnVwaHRycWxjcndmdW9lbXp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMDY4ODAsImV4cCI6MjA4Nzg4Mjg4MH0.XpCM6_7g4Gz3Lluyix8XaRxAaYjMn-ARYZYL2_l--Ho')

// If already logged in, go straight to garage
supabase.auth.getSession().then(({ data: { session } }) => {
  if (session) window.location.href = '/index.html'
})

window.sendLink = async function() {
  const email = document.getElementById('email').value.trim()
  const btn = document.getElementById('send-btn')
  const err = document.getElementById('err-msg')
  err.style.display = 'none'

  if (!email || !email.includes('@')) {
    err.textContent = 'Please enter a valid email address'
    err.style.display = 'block'
    return
  }

  btn.disabled = true
  btn.textContent = 'Sending...'

  const { error } = await supabase.auth.signInWithOtp({
    email,
    options: { emailRedirectTo: 'https://hillardperformance.com/index.html' }
  })

  if (error) {
    err.textContent = error.message
    err.style.display = 'block'
    btn.disabled = false
    btn.textContent = 'Send Login Link'
    return
  }

  document.getElementById('sent-to').textContent = email
  document.getElementById('form-view').style.display = 'none'
  document.getElementById('success-view').style.display = 'block'
}

document.getElementById('email').addEventListener('keydown', e => {
  if (e.key === 'Enter') window.sendLink()
})
</script>
