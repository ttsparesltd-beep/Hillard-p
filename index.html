<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hillard Performance — My Garage</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--surface:#111114;--surface2:#18181d;--border:#2a2a32;--red:#e8291c;--red-dim:rgba(232,41,28,0.1);--red-glow:rgba(232,41,28,0.22);--amber:#f59e0b;--green:#22c55e;--text:#f0f0f4;--text2:#b0b0be;--muted:#6b6b7a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,255,255,0.015) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.015) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}

/* NAV */
.topnav{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10;}
.topnav img{height:30px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--red-dim);border:1px solid var(--red-glow);display:flex;align-items:center;justify-content:center;font-family:"Rajdhani",sans-serif;font-weight:700;font-size:13px;color:var(--red);cursor:pointer;}

/* MAIN */
.main{padding:24px 20px 100px;max-width:480px;margin:0 auto;position:relative;z-index:1;}
.greeting{margin-bottom:24px;animation:fadeUp 0.4s ease both;}
.greeting h2{font-family:"Rajdhani",sans-serif;font-size:24px;font-weight:700;}
.greeting p{color:var(--muted);font-size:13px;margin-top:3px;}
.sh{font-family:"Rajdhani",sans-serif;font-size:11px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.sh::after{content:"";flex:1;height:1px;background:var(--border);}

/* ALERT */
.alert-banner{background:rgba(232,41,28,0.06);border:1px solid rgba(232,41,28,0.2);border-radius:12px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px;font-size:13px;animation:fadeUp 0.4s ease both;}
.alert-banner strong{color:var(--red);display:block;margin-bottom:3px;}
.alert-banner p{color:var(--text2);font-size:12px;line-height:1.5;}

/* VEHICLE CARD */
.vehicle-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:14px;animation:fadeUp 0.4s ease both;}
.vc-top{padding:18px 18px-14px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px;cursor:pointer;}
.vc-reg{background:#f0c000;color:#111;font-family:"Rajdhani",sans-serif;font-weight:700;font-size:18px;letter-spacing:0.18em;padding:6px 14px;border-radius:6px;}
.vc-name{font-family:"Rajdhani",sans-serif;font-size:17px;font-weight:700;margin-top:8px;}
.vc-detail{font-size:12px;color:var(--muted);margin-top:2px;}
.vc-pills{display:flex;gap:8px;padding:14px 18px;flex-wrap:wrap;}
.pill{display:flex;flex-direction:column;flex:1;min-width:90px;background:var(--surface2);border-radius:10px;padding:10px 12px;}
.pill-label{font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;}
.pill-value{font-family:"Rajdhani",sans-serif;font-size:15px;font-weight:700;line-height:1.2;}

/* ADD CAR BUTTON */
.add-car-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:transparent;border:2px dashed #3a3a45;border-radius:16px;padding:20px;width:100%;cursor:pointer;color:var(--muted);font-family:"Rajdhani",sans-serif;font-size:14px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;transition:border-color 0.2s,color 0.2s,background 0.2s;margin-bottom:14px;animation:fadeUp 0.4s ease both;}
.add-car-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-dim);}

/* ADD CAR MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.3s;}
.modal-overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--surface);border:1px solid var(--border);border-radius:24px 24px 0 0;padding:28px 24px 48px;width:100%;max-width:480px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.34,1.06,0.64,1);}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 24px;}
.modal h3{font-family:"Rajdhani",sans-serif;font-size:22px;font-weight:700;margin-bottom:6px;}
.modal p{color:var(--muted);font-size:13px;margin-bottom:24px;line-height:1.5;}

/* REG INPUT */
.reg-input-wrap{display:flex;gap:10px;margin-bottom:16px;}
.reg-plate-input{flex:1;background:#f0c000;border:none;border-radius:10px;padding:14px 16px;font-family:"Rajdhani",sans-serif;font-size:24px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#111;outline:none;text-align:center;}
.reg-plate-input::placeholder{color:#8a7a00;font-size:18px;letter-spacing:0.1em;}
.lookup-btn{background:var(--red);border:none;border-radius:10px;padding:14px 18px;color:white;cursor:pointer;transition:opacity 0.2s;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.lookup-btn:hover{opacity:0.88;}
.lookup-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* LOOKUP RESULT */
.lookup-result{display:none;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.lr-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.04);font-size:13px;}
.lr-row:last-child{border-bottom:none;}
.lr-row span:first-child{color:var(--muted);}
.lr-row span:last-child{font-weight:500;color:var(--text);}
.lr-row .mot-ok{color:var(--green);}
.lr-row .mot-warn{color:var(--amber);}
.lr-row .mot-exp{color:var(--red);}

.lookup-err{display:none;background:rgba(232,41,28,0.08);border:1px solid rgba(232,41,28,0.2);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;color:#f87171;}

.confirm-btn{width:100%;background:var(--red);color:white;border:none;border-radius:9px;padding:14px;font-family:"Rajdhani",sans-serif;font-size:14px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;cursor:pointer;transition:opacity 0.2s;}
.confirm-btn:hover{opacity:0.88;}
.cancel-btn{width:100%;background:transparent;border:1px solid var(--border);border-radius:9px;padding:12px;font-family:"Rajdhani",sans-serif;font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);cursor:pointer;margin-top:8px;transition:border-color 0.2s;}
.cancel-btn:hover{border-color:var(--muted);}

/* SPINNER */
.spin{animation:spinner 0.8s linear infinite;display:inline-block;}
@keyframes spinner{to{transform:rotate(360deg);}}

/* TOAST */
.toast{position:fixed;bottom:110px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);color:#061206;font-family:"Rajdhani",sans-serif;font-size:13px;font-weight:700;letter-spacing:0.1em;padding:11px 22px;border-radius:30px;z-index:50;transition:transform 0.3s cubic-bezier(0.34,1.56,0.64,1),opacity 0.3s;opacity:0;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--muted);font-size:13px;}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;padding:8px 0 20px;z-index:10;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;cursor:pointer;color:var(--muted);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;transition:color 0.2s;}
.nav-item.active{color:var(--red);}
.nav-item svg{width:22px;height:22px;}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
const supabase = createClient('https://jkruphtrqlcrwfuoemzt.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImprcnVwaHRycWxjcndmdW9lbXp0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMDY4ODAsImV4cCI6MjA4Nzg4Mjg4MH0.XpCM6_7g4Gz3Lluyix8XaRxAaYjMn-ARYZYL2_l--Ho')

let currentCustomer = null
let pendingVehicle = null

function formatDate(d) {
  if (!d) return 'Not set'
  return new Date(d).toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'})
}
function motDaysLeft(d) {
  if (!d) return null
  return Math.ceil((new Date(d) - new Date()) / 86400000)
}
function daysColor(d) {
  if (d===null) return '#6b6b7a'
  if (d<0) return '#e8291c'
  if (d<=30) return '#f59e0b'
  return '#22c55e'
}

async function init() {
  const { data: { session } } = await supabase.auth.getSession()
  if (!session) { window.location.href = '/login.html'; return }

  // Get or create customer
  let { data: customer } = await supabase.from('customers').select('*').eq('user_id', session.user.id).single()
  if (!customer) {
    const { data: nc } = await supabase.from('customers').insert({
      user_id: session.user.id,
      email: session.user.email,
      first_name: session.user.email.split('@')[0],
      last_name: ''
    }).select().single()
    customer = nc
  }
  currentCustomer = customer

  const initials = (customer.first_name?.[0]||'') + (customer.last_name?.[0]||'')
  document.getElementById('avatar').textContent = initials || '?'
  document.getElementById('greeting-text').textContent = customer.first_name ? `Hi, ${customer.first_name}` : 'My Garage'

  await loadVehicles()
}

async function loadVehicles() {
  const { data: vehicles } = await supabase
    .from('vehicles').select('*')
    .eq('customer_id', currentCustomer.id)
    .order('created_at', { ascending: false })

  const list = document.getElementById('vehicles-list')
  const alertsEl = document.getElementById('alerts')
  alertsEl.innerHTML = ''

  document.getElementById('add-btn').style.display = 'flex'

window.toggleVehicle = function(id) {
  const exp = document.getElementById('exp-'+id)
  const chev = document.querySelector('#vc-'+id+' .vc-chev')
  const open = exp.style.display === 'none'
  exp.style.display = open ? 'block' : 'none'
  if (chev) chev.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)'
}

window.uploadPhoto = async function(event, vehicleId) {
  const file = event.target.files[0]
  if (!file) return

  showToast('Uploading photo...')

  // Resize image before upload
  const reader = new FileReader()
  reader.onload = async function(e) {
    const img = new Image()
    img.onload = async function() {
      const canvas = document.createElement('canvas')
      const MAX = 800
      let w = img.width, h = img.height
      if (w > h && w > MAX) { h = Math.round(h * MAX / w); w = MAX }
      else if (h > MAX) { w = Math.round(w * MAX / h); h = MAX }
      canvas.width = w; canvas.height = h
      canvas.getContext('2d').drawImage(img, 0, 0, w, h)

      canvas.toBlob(async function(blob) {
        // Upload to Cloudinary using unsigned preset
        const formData = new FormData()
        formData.append('file', blob, 'vehicle.jpg')
        formData.append('upload_preset', 'Hillardp')
        formData.append('folder', 'hillard/vehicles')

        try {
          const res = await fetch('https://api.cloudinary.com/v1_1/dlfthx26f/image/upload', {
            method: 'POST',
            body: formData
          })

          if (!res.ok) {
            const err = await res.json()
            console.error('Cloudinary error:', err)
            showToast('Upload failed: ' + (err.error?.message || 'unknown error'))
            return
          }

          const data = await res.json()
          const photoUrl = data.secure_url
          console.log('Cloudinary upload success:', photoUrl)

          // Save URL to Supabase vehicles table
          const { error } = await supabase
            .from('vehicles')
            .update({ photo_url: photoUrl })
            .eq('id', vehicleId)

          if (error) {
            console.error('Supabase save error code:', error.code)
            console.error('Supabase save error msg:', error.message)
            console.error('Supabase save error details:', error.details)
            console.error('Supabase save error hint:', error.hint)
            showToast('Photo uploaded but could not save — try again')
            return
          }

          // Show photo in card
          const wrap = document.getElementById('photo-wrap-' + vehicleId)
          wrap.innerHTML = '<img src="' + photoUrl + '" style="width:100%;height:140px;object-fit:cover;border-radius:10px;border:1px solid var(--border);">'
          showToast('Photo saved!')

        } catch(err) {
          console.error('Upload error:', err)
          showToast('Upload failed — check your connection')
        }
      }, 'image/jpeg', 0.85)
    }
    img.src = e.target.result
  }
  reader.readAsDataURL(file)
}


  // old code below (unused)
  const _unused = vehicles.map(v => {
    const motDays = motDaysLeft(v.mot_expiry)
    const svcDays = motDaysLeft(v.service_due)
    const details = [v.colour, v.fuel_type, v.year].filter(Boolean).join(' · ')
    return `<div class="vehicle-card">
      <div class="vc-top">
        <div>

          <div class="vc-name">${v.make||''} ${v.model||''}</div>

      <div class="vc-pills">

          <span class="pill-label">MOT Expiry</span>
          <span class="pill-value" style="color:${daysColor(motDays)}">${formatDate(v.mot_expiry)}</span>
        </div>
        <div class="pill">

// ── REG LOOKUP ──────────────────────────────────────────────────────────────
window.lookupReg = async function() {
  const reg = document.getElementById('reg-input').value.replace(/\s/g,'').toUpperCase()
  if (!reg || reg.length < 2) { showErr('Please enter a registration number'); return }

  const btn = document.getElementById('lookup-btn')
  btn.disabled = true
  btn.innerHTML = '<svg class="spin" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>'

  document.getElementById('lookup-result').style.display = 'none'
  document.getElementById('lookup-err').style.display = 'none'
  document.getElementById('confirm-btn').style.display = 'none'

  // Try DVLA API first, fall back to demo mode
  let vehicleData = null
  try {
    const dvlaRes = await fetch('https://driver-vehicle-licensing.api.gov.uk/vehicle-enquiry/v1/vehicles', {
      method: 'POST',
      headers: {
        'x-api-key': 'DEMO_MODE',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ registrationNumber: reg })
    })

    if (dvlaRes.ok) {
      const dvla = await dvlaRes.json()
      vehicleData = {
        registration: reg,
        make: dvla.make,
        model: dvla.make, // DVLA doesn't return model, just make
        colour: dvla.colour,
        year: dvla.yearOfManufacture,
        fuel_type: dvla.fuelType,
        mot_expiry: dvla.motExpiryDate || null,
        source: 'dvla'
      }
    }
  } catch(e) {
    console.log('DVLA API unavailable, using demo mode')
  }

  // Demo mode — realistic fake data for testing
  if (!vehicleData || 'DEMO_MODE' === 'DEMO_MODE') {
    const demos = {
      'AB12CDE': { make:'Ford', model:'Focus', colour:'Silver', year:2018, fuel_type:'Petrol', mot_expiry:'2025-08-14' },
      'LD21XPF': { make:'BMW', model:'M4 Competition', colour:'Black', year:2021, fuel_type:'Petrol', mot_expiry:'2026-03-22' },
      'SK70ABC': { make:'Volkswagen', model:'Golf GTI', colour:'White', year:2020, fuel_type:'Petrol', mot_expiry:'2024-12-01' },
    }
    const d = demos[reg] || {
      make: 'Vehicle', model: 'Found', colour: 'Unknown', year: 2020, fuel_type: 'Petrol', mot_expiry: '2025-11-30'
    }
    vehicleData = { registration: reg, ...d, source: 'demo' }
  }

  pendingVehicle = vehicleData

  // Display result
  const motDays = vehicleData.mot_expiry ? Math.ceil((new Date(vehicleData.mot_expiry) - new Date()) / 86400000) : null
  const motStatusEl = document.getElementById('lr-motstatus')
  let motStatusText = 'Unknown'
  let motStatusClass = ''
  if (motDays !== null) {
    if (motDays < 0) { motStatusText = `Expired ${Math.abs(motDays)} days ago`; motStatusClass = 'mot-exp' }
    else if (motDays <= 30) { motStatusText = `Due in ${motDays} days`; motStatusClass = 'mot-warn' }
    else { motStatusText = `Valid (${motDays} days)`; motStatusClass = 'mot-ok' }
  }

  document.getElementById('lr-make').textContent = [vehicleData.make, vehicleData.model].filter(Boolean).join(' ')
  document.getElementById('lr-colour').textContent = vehicleData.colour || '—'
  document.getElementById('lr-year').textContent = vehicleData.year || '—'
  document.getElementById('lr-fuel').textContent = vehicleData.fuel_type || '—'
  document.getElementById('lr-mot').textContent = vehicleData.mot_expiry ? new Date(vehicleData.mot_expiry).toLocaleDateString('en-GB', {day:'numeric',month:'long',year:'numeric'}) : 'Not found'
  motStatusEl.textContent = motStatusText
  motStatusEl.className = motStatusClass

  document.getElementById('lookup-result').style.display = 'block'
  document.getElementById('confirm-btn').style.display = 'block'

  btn.disabled = false
  btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>'
}

window.addVehicle = async function() {
  if (!pendingVehicle || !currentCustomer) return

  const btn = document.getElementById('confirm-btn')
  btn.textContent = 'Adding...'
  btn.disabled = true

  const { error } = await supabase.from('vehicles').insert({
    customer_id: currentCustomer.id,
    registration: pendingVehicle.registration,
    make: pendingVehicle.make,
    model: pendingVehicle.model,
    colour: pendingVehicle.colour,
    year: pendingVehicle.year,
    fuel_type: pendingVehicle.fuel_type,
    mot_expiry: pendingVehicle.mot_expiry || null
  })

  if (error) {
    showToast('Error adding vehicle — please try again')
    btn.textContent = 'Add This Vehicle to My Garage'
    btn.disabled = false
    return
  }

  closeModal()
  showToast('Vehicle added to your garage!')
  await loadVehicles()
}

// ── MODAL ───────────────────────────────────────────────────────────────────
window.openModal = function() {
  document.getElementById('modal').classList.add('open')
  document.getElementById('reg-input').focus()
  document.getElementById('lookup-result').style.display = 'none'
  document.getElementById('lookup-err').style.display = 'none'
  document.getElementById('confirm-btn').style.display = 'none'
  document.getElementById('reg-input').value = ''
  pendingVehicle = null
}

window.closeModal = function() {
  document.getElementById('modal').classList.remove('open')
}

window.maybeClose = function(e) {
  if (e.target === document.getElementById('modal')) closeModal()
}

function showErr(msg) {
  const el = document.getElementById('lookup-err')
  el.textContent = msg
  el.style.display = 'block'
}

function showToast(msg, color) {
  const t = document.getElementById('toast')
  t.style.background = color || '#22c55e'
  document.getElementById('toast-msg').textContent = msg
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000);
}

init()

// Confirm delete modal
window.confirmDelete = function(vehicleId, reg) {
  if (confirm('Remove ' + reg + ' from your garage?\n\nThis will not affect your service history.')) {
    deleteVehicle(vehicleId, reg)
  }
}

window.deleteVehicle = async function(vehicleId, reg) {
  const { error } = await supabase
    .from('vehicles')
    .delete()
    .eq('id', vehicleId)

  if (error) {
    showToast('Could not remove vehicle')
    console.error(error)
    return
  }

  showToast(reg + ' removed from your garage')
  await loadVehicles()
}
