<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Confirm booking — Hillard Performance</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0a0a0b;color:#f0f0f4;font-family:'Helvetica Neue',Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#111114;border:1px solid #2a2a32;border-radius:20px;padding:32px 24px;max-width:440px;width:100%}
  img.logo{height:44px;display:block;margin-bottom:24px}
  h1{font-size:22px;margin-bottom:6px}
  .sub{color:#a0a0b0;font-size:14px;line-height:1.6;margin-bottom:20px}
  .details{background:#0a0a0b;border:1px solid #2a2a32;border-radius:12px;padding:14px 16px;margin-bottom:20px}
  .row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
  .row .l{color:#6b6b7a}.row .v{font-weight:600;text-align:right}
  label{display:block;font-size:12px;color:#6b6b7a;margin-bottom:6px;letter-spacing:.05em;text-transform:uppercase}
  input[type=date]{width:100%;background:#0a0a0b;border:1px solid #2a2a32;color:#f0f0f4;border-radius:10px;padding:12px;font-size:16px;margin-bottom:18px;color-scheme:dark}
  button{width:100%;border:0;border-radius:12px;padding:16px;font-size:15px;font-weight:700;letter-spacing:.06em;cursor:pointer;background:#4ade80;color:#0a0a0b}
  button:disabled{opacity:.5;cursor:default}
  .msg{margin-top:16px;font-size:14px;line-height:1.6;color:#a0a0b0}
  .ok{color:#4ade80}.err{color:#e8291c}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:#2a2a32}
  a{color:#4a9eff}
  .hide{display:none}
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/logo.png" alt="Hillard Performance">
  <h1 id="title">Loading booking…</h1>
  <p class="sub" id="sub"></p>

  <div class="details hide" id="details">
    <div class="row"><span class="l">Customer</span><span class="v" id="d-cust"></span></div>
    <div class="row"><span class="l">Vehicle</span><span class="v" id="d-veh"></span></div>
    <div class="row"><span class="l">Job</span><span class="v" id="d-job"></span></div>
    <div class="row"><span class="l">Requested</span><span class="v" id="d-req"></span></div>
    <div class="row"><span class="l">Status</span><span class="v"><span class="pill" id="d-status"></span></span></div>
  </div>

  <div id="form" class="hide">
    <label for="date">Confirm for</label>
    <input type="date" id="date">
    <button id="go" onclick="confirmBooking()">✓ CONFIRM &amp; EMAIL CUSTOMER</button>
  </div>
  <div class="msg" id="msg"></div>
  <p class="msg"><a href="/admin">Open admin</a></p>
</div>

<script src="/hillard-states.js"></script>
<script>
/* Pending → confirmed happens only here (or in admin), never just by opening a link:
   email scanners open links on their own. See STATE_MACHINES.md. */
const FN = 'https://ixgotsabbqkkxzsxnwtr.supabase.co/functions/v1/booking-confirm';
const id = new URLSearchParams(location.search).get('id') || '';
const $ = x => document.getElementById(x);
const label = s => window.HP_STATES ? HP_STATES.label('booking', s) : String(s || '').replace(/_/g, ' ');
const pretty = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '—';

function show(b) {
  $('details').classList.remove('hide');
  $('d-cust').textContent = b.customer || '—';
  $('d-veh').textContent = b.vehicle || '—';
  $('d-job').textContent = b.repair_type || '—';
  $('d-req').textContent = pretty(b.preferred_date);
  $('d-status').textContent = label(b.status);
  if (b.status === 'pending') {
    $('title').textContent = 'Confirm this booking?';
    $('sub').textContent = 'The customer gets their confirmation email as soon as you press confirm.';
    $('date').value = b.preferred_date || '';
    $('form').classList.remove('hide');
  } else {
    $('form').classList.add('hide');
    $('title').textContent = b.status === 'confirmed' ? 'Already confirmed' : 'Booking is ' + label(b.status).toLowerCase();
    $('sub').textContent = b.confirmed_date ? 'Booked in for ' + pretty(b.confirmed_date) + '. Nothing to do here.' : 'Nothing to do here.';
  }
}

async function load() {
  if (!/^[0-9a-f-]{36}$/i.test(id)) { $('title').textContent = 'No booking in this link'; return; }
  try {
    const r = await (await fetch(FN + '?format=json&id=' + encodeURIComponent(id))).json();
    if (!r.ok) { $('title').textContent = 'Booking not found'; $('sub').textContent = r.error || ''; return; }
    show(r.booking);
  } catch (e) { $('title').textContent = 'Couldn’t load the booking'; $('sub').textContent = e.message; }
}

async function confirmBooking() {
  $('go').disabled = true; $('msg').className = 'msg'; $('msg').textContent = 'Confirming…';
  try {
    const res = await fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, date: $('date').value || null }) });
    const r = await res.json();
    if (!r.ok) { $('msg').className = 'msg err'; $('msg').textContent = r.error || 'Something went wrong'; $('go').disabled = false; return; }
    show(r.booking);
    $('msg').className = 'msg ok';
    $('msg').textContent = r.already ? 'It was already confirmed, so no email was sent.'
      : (r.emailed ? '✓ Confirmed. The customer has been emailed.' : '✓ Confirmed. There’s no email on file, so let the customer know yourself.');
  } catch (e) { $('msg').className = 'msg err'; $('msg').textContent = e.message; $('go').disabled = false; }
}
load();
</script>
</body>
</html>
